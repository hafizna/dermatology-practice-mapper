# Registry sumber data dan aturan hormat-sumber (spec §3.6, §3.7, Fase 2-3).
#
# Setiap entry di sini adalah declaration, bukan implementasi. Adapter
# scraper (src/scrapers/<group>.py) membaca base_urls dari sini agar tidak
# ada URL yang hardcoded di dalam kode parser.

crawl_policy:
  respect_robots_txt: true
  rate_limit_seconds_per_domain: 2
  user_agent: "DermPracticeMapper/0.1 (research tool; contact: hafizna.arsyil@gmail.com)"
  max_retries: 3
  backoff_factor: 2.0
  allow_playwright_if_js_required: true
  allow_evasion_techniques: false   # tidak pernah diaktifkan (spec §3.6)

# Tier 1 = situs resmi RS/grup RS
# Tier 2 = aggregator (fallback saja)
# Tier 3 = manual override (prioritas tertinggi untuk field yang di-override,
#          tapi nilai scraper tetap disimpan untuk audit — spec Fase 3)
source_tiers:
  tier_1: "official_hospital_site"
  tier_2: "aggregator"
  tier_3: "manual_override"

registry_sources:
  overpass:
    tier: tier_1
    # overpass-api.de (endpoint resmi di spec) melarang /api/ via robots.txt
    # -- Disallow: /api/ -- yang justru mencakup /api/interpreter. Per
    # keputusan pengguna, dipakai mirror publik resmi (Kumi Systems) yang
    # tidak menerbitkan robots.txt restriktif untuk path ini (dicek manual
    # 2026-08-08, HTTP 200 di /robots.txt -> "Not Found" = tidak ada aturan
    # disallow). Jika mirror ini nanti menerbitkan robots.txt yang melarang,
    # scraper WAJIB berhenti sesuai spec §3.6.
    base_url: "https://overpass.kumi.systems/api/interpreter"
    query_tag: "amenity=hospital"
    # Bbox spec asli (-6.50,106.55,-5.95,107.10) TERBUKTI memotong wilayah:
    # cek manual 2026-08-08 menemukan "RS Harapan" di lon 107.1594 (Cikarang/
    # Bekasi timur), di luar east=107.10. Diperluas dengan margin aman untuk
    # mencakup Kab. Tangerang barat (Kronjo/Mekar Baru, ~lon 106.35), Kab.
    # Bogor selatan (Jasinga/Sukajaya, ~lat -6.75), Jakarta Utara pesisir
    # (~lat -6.05), dan Bekasi/Cikarang timur (~lon 107.25). Format:
    # (south,west,north,east). Verifikasi ulang bila registry hasil Fase 1
    # menunjukkan indikasi RS masih terpotong di pinggir bbox ini.
    bbox_jabodetabek: "-6.80,106.30,-5.90,107.30"
  kemkes:
    tier: tier_1
    base_url: "https://rs.kemkes.go.id"
    notes: >
      Cari endpoint API/structured terlebih dahulu sebelum HTML parsing
      (spec §3.7). Jangan dijadikan satu-satunya sumber registry.
  nominatim:
    tier: tier_2
    # Fallback geocoder untuk RS yang lolos dari registry Fase 1 tanpa
    # koordinat (spec §9 Fase 5) -- BUKAN sumber utama, karena OSM
    # Overpass (Fase 1) sudah memberi koordinat utuh untuk seluruh 554 RS
    # per 2026-08-08. Endpoint publik resmi osm.org, rate limit wajib
    # maks 1 request/detik per kebijakan pemakaian Nominatim publik
    # (lebih ketat dari crawl_policy default 1 req/2 detik).
    base_url: "https://nominatim.openstreetmap.org/search"
    notes: >
      Belum pernah dipanggil (per 2026-08-08) -- seluruh RS di registry
      sudah punya lat/lon dari Overpass. Kode Fase 5
      (src/enrich/geocode.py) tetap dibangun untuk menangani kasus RS baru
      tanpa koordinat di masa depan (mis. entry manual override baru).

# Target group untuk adapter dokter/jadwal (Fase 2-3). URL bersifat
# reconnaissance per Agustus 2026 (Appendix A) — WAJIB diverifikasi ulang
# sebelum dipakai menulis parser karena struktur situs dapat berubah.
doctor_schedule_sources:
  # Status akses dicek 2026-08-08 dengan User-Agent jujur (tanpa menyamar
  # sebagai browser), sesuai spec §3.6. "accessible" = homepage/robots.txt
  # merespons normal, BUKAN jaminan struktur data dokter/jadwal sudah
  # direconnaissance penuh (itu baru terjadi saat adapter masing-masing
  # ditulis di Fase 3).
  eka:
    tier: tier_1
    display_name: "Eka Hospital"
    base_urls:
      - "https://booking.ekahospital.com"
    requires_js: false
    access_status: "blocked"
    notes: >
      BLOCKED (2026-08-08): booking.ekahospital.com mengembalikan HTTP 403
      dari CloudFront untuk User-Agent jujur MAUPUN Playwright Chromium asli
      (headless, bukan UA palsu). curl dengan UA browser biasa sempat lolos
      sekali, tapi itu bot-protection yang tidak konsisten, bukan akses
      normal — TIDAK dipakai karena akan jadi UA spoofing (dilarang §3.6).
      Diganti oleh Siloam sebagai pilot adapter Fase 2 (keputusan pengguna).
      Revisit hanya jika ada jalur akses resmi/izin dari pihak Eka.
  siloam:
    tier: tier_1
    display_name: "Siloam Hospitals"
    base_urls:
      - "https://www.siloamhospitals.com"
      - "https://mysiloam-api.siloamhospitals.com"
    requires_js: false
    access_status: "accessible"
    notes: >
      PILOT ADAPTER FASE 2 (src/scrapers/siloam.py). SPA (Vite), tapi
      backend API publik di mysiloam-api.siloamhospitals.com merespons
      JSON langsung ke curl + UA jujur (200 OK), tidak butuh Playwright di
      runtime (hanya dipakai sekali saat recon untuk menemukan endpoint).
      Endpoint kunci: GET /api/v2/doctors/withavailability?specialityId=...
      (listing, speciality_id dermatologi = 44d54965-b740-451c-9fec-
      a21b6e7544bf) dan GET /api/v2/schedules/withavailability/doctor/{id}
      (jadwal + hospital_address per dokter). Hasil recon 2026-08-08:
      119 dermatologis network-wide, 51 di Jabodetabek (address-verified,
      bukan cuma name-matching -- lihat _is_jabodetabek_hospital).
  mitra_keluarga:
    tier: tier_1
    display_name: "Mitra Keluarga"
    base_urls:
      - "https://www.mitrakeluarga.com"
    requires_js: null
    access_status: "accessible"
    notes: >
      Dicek 2026-08-08: robots.txt "Allow: /" penuh, homepage 200 dengan
      UA jujur. Struktur data dokter/jadwal belum direconnaissance detail
      (giliran Fase 3).
  hermina:
    tier: tier_1
    display_name: "Hermina"
    base_urls:
      - "https://api.herminahospitals.com"
    requires_js: null
    access_status: "accessible"
    notes: >
      Dicek 2026-08-08: homepage redirect 308 -> /id, final 200 dengan UA
      jujur. RIWAYAT PENTING: recon pertama pakai halaman
      /id/doctors/specialist/{slug} (data RSC-embedded) hanya menemukan 12
      dokter kulit se-Indonesia -- pengguna dengan tepat menandai ini
      tidak masuk akal (cabang Jakarta seperti Ciledug/Ciputat/Serpong
      sama sekali tidak muncul). Pengguna menemukan endpoint yang benar:
      GET api.herminahospitals.com/api/v1/public/doctors?page={n}
      &per_page=20&lang=id&speciality_id=kulit-dan-kelamin-dermatologi-
      dan-venereologi -- terkonfirmasi count=146 nasional, 8 halaman,
      SEMUA cabang yang sebelumnya hilang muncul kembali. Adapter
      (src/scrapers/hermina.py) sudah diperbaiki memakai endpoint ini dan
      terdaftar di registry. Situs memang lambat merespons (butuh wait
      panjang saat recon Playwright) -- bukan bug scraper.
  primaya:
    tier: tier_1
    display_name: "Primaya"
    base_urls:
      - "https://primayahospital.com"
    requires_js: null
    access_status: "accessible"
    notes: >
      Dicek 2026-08-08: homepage 200 dengan UA jujur. Struktur data
      dokter/jadwal belum direconnaissance detail.
  emc:
    tier: tier_1
    display_name: "EMC"
    base_urls:
      - "https://www.emc.id"
    requires_js: null
    access_status: "accessible"
    notes: >
      Dicek 2026-08-08: emc.id redirect 301 -> www.emc.id/id, final 200
      dengan UA jujur. Struktur data dokter/jadwal belum direconnaissance.
  bethsaida:
    tier: tier_1
    display_name: "Bethsaida"
    base_urls:
      - "https://www.bethsaidahospitals.com"
    requires_js: null
    access_status: "accessible"
    notes: >
      Domain awal (rsbethsaida.com) di config lama TIDAK RESOLVE (salah
      tebak). Domain benar: bethsaidahospitals.com (dikonfirmasi via
      pencarian web 2026-08-08), homepage 200 dengan UA jujur (robots.txt
      404, artinya tidak ada file robots.txt sama sekali -- bukan larangan).
      Struktur data dokter/jadwal belum direconnaissance detail.
  rs_pondok_indah:
    tier: tier_1
    display_name: "RS Pondok Indah"
    base_urls:
      - "https://www.rspondokindah.co.id"
    requires_js: null
    access_status: "accessible"
    notes: >
      Dicek 2026-08-08: homepage redirect 307 -> /id, final 200 dengan UA
      jujur. Struktur data dokter/jadwal belum direconnaissance detail.
  mayapada:
    tier: tier_1
    display_name: "Mayapada"
    base_urls:
      - "https://www.mayapadahospital.com"
    requires_js: null
    access_status: "accessible"
    notes: >
      Dicek 2026-08-08: robots.txt 200, homepage 200 dengan UA jujur.
      Struktur data dokter/jadwal belum direconnaissance detail.
  brawijaya:
    tier: tier_1
    display_name: "Brawijaya"
    base_urls:
      - "https://brawijayahospital.com"
    requires_js: null
    access_status: "accessible_via_curl_only"
    notes: >
      Domain awal (rsbrawijaya.co.id) di config lama TIDAK RESOLVE (salah
      tebak -- itu domain RSAD Brawijaya, institusi berbeda). Domain benar
      untuk grup RS Brawijaya (preferred group ini): brawijayahospital.com
      (dikonfirmasi via pencarian web 2026-08-08), homepage 200 dengan UA
      jujur. Sempat dicatat keliru sebagai "tidak ada layanan dermatologi"
      (2026-08-08) -- dikoreksi pengguna: Brawijaya memang menyediakan SpKK.
      CATATAN PENTING: halaman utama (/find-doctor) diproteksi Cloudflare
      dengan pola sama seperti Eka (headless Playwright 403 "cdn-cgi/
      challenge-platform", headful 200). TAPI endpoint /api/* (dipakai
      frontend situs sendiri) TIDAK diproteksi seketat itu -- terkonfirmasi
      curl (UA jujur) selalu 200, sedangkan httpx (Python, dipakai
      BaseScraper standar) selalu 403 untuk endpoint yang SAMA PERSIS --
      kemungkinan besar Cloudflare fingerprint TLS/HTTP2 client, bukan
      header. src/scrapers/brawijaya.py karena itu pakai method
      _curl_get_json (subprocess ke curl.exe sistem) alih-alih _get_json
      biasa -- satu-satunya adapter di proyek ini yang butuh ini.
      Endpoint: /api/proxy?service=data&path=items/branch (daftar 7 cabang,
      semua Jabodetabek) dan /api/appointment/getSpecialistDoctorsSchedule
      ?group=true&rsid={id} (jadwal per cabang, semua spesialisasi
      sekaligus, di-filter ke grup "Dermat"/"Kulit" -- KEDUANYA dipakai
      situs untuk dermatologi tanpa overlap dokter, filter tunggal akan
      kehilangan separuh data). Cabang rsid=66 (Taman Mini) sempat 500 dari
      server mereka sendiri saat recon -- ditangani graceful (skip +
      log), bukan block.
  sari_asih:
    tier: tier_1
    display_name: "Sari Asih"
    base_urls:
      - "https://www.sariasih.id"
    requires_js: false
    access_status: "accessible"
    notes: >
      Dicek 2026-08-09: robots.txt mengizinkan crawling dengan
      Crawl-delay: 10. Listing dermatologi server-rendered dan paginated;
      kartu dokter serta tabel jadwal lengkap tersedia tanpa JavaScript.
      Adapter mengikuti delay 10 detik (lebih ketat dari default global),
      memvalidasi kredensial, dan mengecualikan cabang Serang yang berada
      di luar Jabodetabek tanpa mengecualikan Sangiang (Kota Tangerang).
  rs_premier:
    tier: tier_1
    display_name: "RS Premier"
    base_urls:
      - "https://www.rspremierjatinegara.com"
      - "https://www.rspremierbintaro.com"
    requires_js: false
    access_status: "accessible"
    notes: >
      Dicek 2026-08-09: robots.txt kedua domain mengizinkan crawling.
      Halaman Jatinegara tidak mempunyai dropdown/parameter cabang;
      Bintaro memakai domain terpisah dengan struktur yang sama. Daftar
      dokter server-rendered, jadwal berasal dari endpoint publik
      /xhr/doctor-schedule?id=... . Jaringan resmi hanya mencantumkan
      Bintaro, Jatinegara, dan Surabaya; adapter mengambil dua cabang
      Jabodetabek dan mengecualikan Surabaya.
  columbia_asia:
    tier: tier_1
    display_name: "Columbia Asia"
    base_urls:
      - "https://columbiaasia.co.id"
    requires_js: false
    access_status: "accessible"
    notes: >
      Dicek 2026-08-09: robots.txt tidak melarang path apa pun. Listing
      dokter WordPress bersifat server-rendered; specialty=119 adalah
      DERMATOLOGY. ID lokasi ditemukan dari filter resmi, bukan diduplikasi
      di adapter. Cabang Jabodetabek adalah BSD dan Pulomas; profil dokter
      masing-masing memuat tabel jadwal mingguan server-rendered.

